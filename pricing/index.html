<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var stored = localStorage.getItem('theme');
            var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../images/No-Tea Studio favicon.png">

    <meta name="author" content="No-Tea Studio">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://noteastudio.co.uk/about/">
    <meta property="og:title" content="About No-Tea Studio | Custom Web Design">
    <meta property="og:description" content="We build custom websites with transparent AI use and genuine client collaboration. Learn more about our approach.">

</head>
